<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Four Moves to Alignment</title>
  <meta name="description" content="Interactive leadership scenario: practice resolving a performance conflict by listening, using evidence, aligning priorities, and measuring results." />
  <meta name="theme-color" content="#B01857" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23B01857'/%3E%3Ccircle cx='20' cy='44' r='8' fill='%23F1C232'/%3E%3Ccircle cx='44' cy='44' r='8' fill='%23F1C232'/%3E%3Ccircle cx='20' cy='20' r='8' fill='%23FFD3E5'/%3E%3Ccircle cx='44' cy='20' r='8' fill='%23F1C232'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================
   Four Moves to Alignment — brand palette
   ========================================================== */
:root {
  /* Pinks / magenta */
  --berry: #B01857;
  --hot-pink: #FF257D;
  --pink: #FF66A4;
  --pink-soft: #FF92BE;
  --blush: #FFD3E5;
  /* Grays */
  --charcoal: #5B5B5B;
  --gray: #7B7B7B;
  --gray-mid: #ADADAD;
  --gray-light: #DEDEDE;
  /* Golds */
  --gold: #F1C232;
  --gold-2: #F2C846;
  --gold-soft: #F6DA84;
  /* Greens */
  --green: #5F9747;
  --green-mid: #7EAB6B;
  --green-soft: #BFD5B5;

  --ink: #2e2e2e;
  --bg: #fff8fb;
  --surface: #ffffff;
  --radius: 16px;
  --shadow: 0 10px 30px rgba(176, 24, 87, .10), 0 2px 6px rgba(0, 0, 0, .05);
  --font-head: 'Roboto Slab', Georgia, serif;
  --font-body: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(255, 146, 190, .25), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(246, 218, 132, .25), transparent 60%),
    var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; margin: 0; color: var(--berry); }
p { margin: 0; }
a { color: var(--berry); }
button { font: inherit; }
.ico { width: 1.25em; height: 1.25em; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: -999px; top: 8px; background: var(--berry); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 10; }
.skip-link:focus { left: 8px; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 8px; }
[hidden] { display: none !important; }

/* ---------------- Top bar ---------------- */
.topbar { background: var(--berry); color: #fff; position: sticky; top: 0; z-index: 5; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
.topbar__inner { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand__mark { width: 38px; height: 38px; border-radius: 10px; background:
  radial-gradient(circle at 30% 70%, var(--gold) 0 7px, transparent 8px),
  radial-gradient(circle at 70% 70%, var(--gold) 0 7px, transparent 8px),
  radial-gradient(circle at 70% 30%, var(--gold) 0 7px, transparent 8px),
  radial-gradient(circle at 30% 30%, var(--blush) 0 7px, transparent 8px),
  rgba(255,255,255,.15); flex: none; }
.brand__name { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; }
.brand__sub { font-size: .8rem; opacity: .85; }

.progress { list-style: none; display: flex; gap: 6px; margin: 0 auto; padding: 0; }
.progress li { width: 28px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.3); transition: background .4s; }
.progress li.is-done { background: var(--gold-soft); }
.progress li.is-current { background: var(--gold); box-shadow: 0 0 0 2px rgba(241,194,50,.35); }

.controls { display: flex; gap: 8px; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.55); background: transparent; color: #fff; cursor: pointer; font-size: .85rem; font-weight: 500; transition: background .2s, color .2s; }
.icon-btn:hover { background: rgba(255,255,255,.14); }
.icon-btn[aria-pressed="true"] { background: #fff; color: var(--berry); border-color: #fff; }
.icon-btn__icon { display: inline-flex; }

/* ---------------- Layout ---------------- */
.layout { flex: 1; width: 100%; max-width: 1240px; margin: 0 auto; padding: 28px 20px 40px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 32px; align-items: start; }
.story { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; min-width: 0; border-top: 6px solid var(--berry); }
.story.enter .screen { animation: fadeUp .5s ease both; }

.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--charcoal); background: var(--blush); padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
.eyebrow .ico { color: var(--berry); }
.screen h1 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); font-weight: 700; margin-bottom: 18px; outline: none; }
.lead { font-size: 1.12rem; color: var(--charcoal); margin-bottom: 18px; }

.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 24px; }
.chips li { font-size: .85rem; font-weight: 500; padding: 5px 12px; border-radius: 999px; background: #fff; border: 1.5px solid var(--pink-soft); color: var(--berry); }

.how { background: #fffaf0; border: 1.5px solid var(--gold-soft); border-radius: 14px; padding: 20px 22px; margin-bottom: 24px; }
.how h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 12px; }
.how ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.how li { display: flex; gap: 12px; align-items: flex-start; }
.how li .ico { color: var(--berry); margin-top: 2px; }
.tip { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--gray); margin-top: 18px; }

/* ---------------- Buttons ---------------- */
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 22px; border-radius: 999px; font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer; border: 2px solid transparent; transition: transform .15s, box-shadow .2s, background .2s; }
.btn--primary { background: var(--berry); color: #fff; box-shadow: 0 6px 16px rgba(176,24,87,.3); }
.btn--primary:hover { background: #c41d63; transform: translateY(-2px); box-shadow: 0 10px 22px rgba(255,37,125,.35); }
.btn--ghost { background: #fff; color: var(--berry); border-color: var(--berry); }
.btn--ghost:hover { background: var(--blush); }
.actions:not([hidden]) { animation: fadeUp .45s ease both; }

/* ---------------- Visual panels ---------------- */
.visual { margin: 0 0 22px; background: linear-gradient(180deg, #fff, #fff5f9); border: 1.5px solid var(--blush); border-radius: 14px; padding: 18px; }
.visual figcaption { font-size: .85rem; color: var(--gray); margin-top: 12px; font-style: italic; }

.dash__head { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: .9rem; color: var(--charcoal); margin-bottom: 14px; }
.dash__head .ico { color: var(--berry); }
.dash__tag { margin-left: auto; background: var(--charcoal); color: #fff; font-size: .75rem; padding: 2px 10px; border-radius: 999px; }
.dash__kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.kpi { display: flex; gap: 10px; align-items: center; padding: 12px; border-radius: 12px; background: #fff; border: 1.5px solid var(--gray-light); }
.kpi .ico { width: 30px; height: 30px; padding: 6px; border-radius: 8px; }
.kpi strong { display: block; font-family: var(--font-head); font-size: 1.4rem; line-height: 1.1; }
.kpi span { font-size: .8rem; color: var(--gray); }
.kpi--good .ico { background: var(--green-soft); color: var(--green); }
.kpi--good strong { color: var(--green); }
.kpi--bad .ico { background: var(--blush); color: var(--berry); }
.kpi--bad strong { color: var(--berry); }
.dash__chart { height: 90px; display: flex; align-items: flex-end; gap: 8px; padding: 0 4px; border-bottom: 2px solid var(--gray-light); }
.dash__chart span { flex: 1; height: var(--h); border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--pink), var(--berry)); transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 80ms); }
.dash__axis { display: flex; justify-content: space-between; font-size: .75rem; color: var(--gray); margin-top: 6px; }

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 14px 8px; border-radius: 12px; background: #fff; border: 1.5px solid var(--pink-soft); animation: fadeUp .5s ease both; animation-delay: calc(var(--i) * 120ms); }
.tile .ico { width: 30px; height: 30px; color: var(--berry); }
.tile__label { font-size: .82rem; font-weight: 500; line-height: 1.25; }
.tile__value { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--green); background: var(--green-soft); padding: 2px 8px; border-radius: 999px; }
.tile--muted { border-color: var(--gray-light); background: #fafafa; }
.tile--muted .ico { color: var(--gray); }
.tile--muted .tile__value { color: var(--charcoal); background: var(--gray-light); }

.huddle { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.huddle__group { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 16px; background: #fff; border-radius: 12px; border: 1.5px solid var(--pink-soft); font-weight: 500; font-size: .9rem; animation: fadeUp .5s ease both; animation-delay: calc(var(--i) * 140ms); }
.huddle__group .ico { width: 30px; height: 30px; color: var(--berry); }
.huddle__link { color: var(--gold); display: inline-flex; }
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.insights li { display: flex; gap: 10px; align-items: center; background: #fffaf0; border-left: 4px solid var(--gold); padding: 9px 12px; border-radius: 8px; font-size: .92rem; }
.insights .ico { color: var(--charcoal); }

.proto { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; align-items: center; }
.proto__screen { background: var(--charcoal); color: #fff; border-radius: 10px 10px 0 0; padding: 14px; border: 6px solid #3f3f3f; display: grid; gap: 8px; font-size: .85rem; }
.proto__screen p { display: flex; gap: 8px; align-items: flex-start; }
.proto__title { font-weight: 700; color: var(--gold); }
.proto__msg { background: rgba(255,255,255,.1); padding: 8px; border-radius: 8px; }
.proto__warn { color: var(--pink-soft); }
.proto__base { height: 10px; background: var(--gray-mid); border-radius: 0 0 12px 12px; margin: 0 -10px; }
.proto__aid { background: #fff; border: 1.5px dashed var(--green-mid); border-radius: 12px; padding: 12px 14px; font-size: .85rem; animation: fadeUp .6s .3s ease both; }
.proto__aid-title { display: flex; gap: 6px; align-items: center; font-weight: 700; color: var(--green); margin-bottom: 6px; }
.proto__aid ol { margin: 0; padding-left: 20px; }

.pilot { display: flex; align-items: stretch; gap: 6px; }
.pilot__step { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 14px 8px; background: #fff; border-radius: 12px; border: 1.5px solid var(--pink-soft); font-size: .82rem; }
.pilot__step .ico { width: 30px; height: 30px; color: var(--berry); }
.pilot__step strong { font-size: .9rem; }
.pilot__step span { color: var(--gray); }
.pilot__arrow { align-self: center; color: var(--gold); display: inline-flex; }

.plan { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.plan li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 8px 12px; border-radius: 12px; background: #fff; border: 2px solid var(--green-mid); font-weight: 500; font-size: .9rem; text-align: center; animation: pulseIn .55s ease both; animation-delay: calc(400ms + var(--i) * 160ms); }
.plan .ico { width: 30px; height: 30px; color: var(--green); }
.plan__num { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: var(--ink); font-weight: 700; font-size: .75rem; }

/* ---------------- Dialogue ---------------- */
.dialogue { display: grid; gap: 14px; }
.line { display: flex; gap: 12px; align-items: flex-start; animation: fadeUp .5s ease both; animation-delay: calc(350ms + var(--i) * 900ms); }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: #fff; }
.avatar .ico { width: 22px; height: 22px; }
.avatar--narrator { background: var(--charcoal); }
.avatar--jordan { background: var(--gold); color: var(--ink); }
.avatar--maia { background: var(--berry); }
.avatar--luis { background: var(--green); }
.bubble { background: #fff; border: 1.5px solid var(--gray-light); border-radius: 4px 14px 14px 14px; padding: 12px 16px; flex: 1; min-width: 0; }
.bubble__who { font-family: var(--font-head); font-weight: 600; font-size: .9rem; color: var(--charcoal); margin-bottom: 2px; }
.bubble__who span { font-family: var(--font-body); font-weight: 400; color: var(--gray); }
.line--narrator .bubble { background: #f6f6f6; border-color: transparent; font-style: italic; }
.line--jordan .bubble { border-color: var(--gold-soft); }
.line--maia .bubble { border-color: var(--pink-soft); }
.line--luis .bubble { border-color: var(--green-soft); }

/* ---------------- Decision ---------------- */
.decision { margin-top: 26px; padding-top: 22px; border-top: 2px dashed var(--blush); }
.decision.reveal { animation: fadeUp .5s ease both; }
.decision__tag { display: inline-flex; gap: 8px; align-items: center; font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--berry); margin-bottom: 6px; }
.decision__q { font-size: 1.35rem; font-weight: 600; color: var(--ink); margin-bottom: 14px; }
.options { display: grid; gap: 10px; }
.option { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; background: #fff; border: 2px solid var(--gray-light); cursor: pointer; color: var(--ink); transition: border-color .2s, transform .15s, box-shadow .2s, background .2s; }
.option:hover:not(:disabled) { border-color: var(--pink); transform: translateX(4px); box-shadow: 0 6px 16px rgba(255,102,164,.18); }
.option__key { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--blush); color: var(--berry); font-family: var(--font-head); font-weight: 700; }
.option__text { flex: 1; }
.option__state { display: inline-flex; width: 24px; }
.option:disabled { cursor: default; }
.option.is-tried { background: #fffaf0; border-color: var(--gold-soft); color: var(--gray); }
.option.is-tried .option__key { background: var(--gold-soft); color: var(--charcoal); }
.option.is-tried .option__state { color: #a07d10; }
.option.is-correct { background: #f3f8f1; border-color: var(--green); color: var(--ink); }
.option.is-correct .option__key { background: var(--green); color: #fff; }
.option.is-correct .option__state { color: var(--green); }
.option:disabled:not(.is-correct):not(.is-tried) { opacity: .55; }

.feedback { display: flex; gap: 14px; margin-top: 16px; padding: 16px 18px; border-radius: 14px; animation: fadeUp .4s ease both; }
.feedback__icon { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; }
.feedback__title { font-family: var(--font-head); font-weight: 700; margin-bottom: 4px; }
.feedback--good { background: #f3f8f1; border: 2px solid var(--green-soft); }
.feedback--good .feedback__icon { background: var(--green); color: #fff; }
.feedback--good .feedback__title { color: var(--green); }
.feedback--warn { background: #fffaf0; border: 2px solid var(--gold-soft); }
.feedback--warn .feedback__icon { background: var(--gold); color: var(--ink); }
.feedback--warn .feedback__title { color: #8a6a0c; }
.feedback__retry { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-weight: 700; color: var(--berry); }
.feedback.shake { animation: shake .45s ease both; }

/* ---------------- Closing ---------------- */
.takeaways { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
.takeaways li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; border: 1.5px solid var(--blush); border-radius: 14px; font-size: 1.05rem; font-weight: 500; animation: fadeUp .5s ease both; animation-delay: calc(var(--i) * 150ms); }
.takeaways__disc { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #d9a91c); color: var(--charcoal); flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12); }
.takeaways__num { font-family: var(--font-head); font-weight: 700; color: var(--berry); }
.score { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; padding: 10px 14px; border-radius: 12px; background: #f3f8f1; color: var(--charcoal); font-size: .95rem; }
.score .ico { color: var(--gold); fill: var(--gold); }
.cta { margin-top: 22px; padding: 22px; border-radius: 14px; background: linear-gradient(135deg, var(--berry), #d4206b); color: #fff; }
.cta__text { font-family: var(--font-head); font-size: 1.15rem; font-weight: 600; }
.cta .actions { margin-top: 16px; }
.cta .btn--primary { background: #fff; color: var(--berry); box-shadow: none; }
.cta .btn--primary:hover { background: var(--blush); }
.cta .btn--ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.8); }
.cta .btn--ghost:hover { background: rgba(255,255,255,.12); }

/* ---------------- Board ---------------- */
.board-panel { position: sticky; top: 92px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.board-panel__head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.board-panel__title { font-size: 1.2rem; font-weight: 600; }
.board-panel__count { font-size: .85rem; font-weight: 700; color: var(--charcoal); background: var(--blush); padding: 3px 10px; border-radius: 999px; }
.board-panel__hint { font-size: .82rem; color: var(--gray); margin-top: 12px; }

.board { position: relative; width: 100%; aspect-ratio: 7 / 6; color: var(--berry); }
.board__discs { position: absolute; inset: 0; border-radius: 4%; background: var(--blush); overflow: hidden; }
.board__front { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 8px 14px rgba(176,24,87,.3)); pointer-events: none; }
.board__line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.board__line line { stroke: var(--green); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 320; stroke-dashoffset: 320; opacity: 0; }
.board.is-win .board__line line { opacity: .8; animation: drawLine .8s .35s ease forwards; }

.disc { position: absolute; width: calc(100% / 7); height: calc(100% / 6); padding: 1.2%; }
.disc__face { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; color: var(--charcoal);
  background: radial-gradient(circle at 35% 30%, #fbe8a6, var(--gold) 55%, #d9a91c);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.14), inset 0 0 0 5px rgba(255,255,255,.25); }
.disc__face .ico { width: 42%; height: 42%; }
.disc.is-dropping { animation: drop .75s cubic-bezier(.45,0,1,1) both; }
.board.is-win .disc__face { animation: glow 1.4s ease-in-out .3s infinite alternate; }

.board-legend { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.legend-slot { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .68rem; font-weight: 700; color: var(--gray-mid); text-align: center; transition: color .3s; }
.legend-slot .ico { width: 18px; height: 18px; }
.legend-slot.is-on { color: var(--berry); }

/* ---------------- Footer ---------------- */
.footer { text-align: center; padding: 18px 20px 28px; font-size: .85rem; color: var(--gray); }

/* ---------------- Animations ---------------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes pulseIn { 0% { opacity: 0; transform: scale(.85); } 70% { transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
@keyframes drop {
  0%   { transform: translateY(var(--fall)); }
  68%  { transform: translateY(0); animation-timing-function: ease-out; }
  80%  { transform: translateY(-14%); animation-timing-function: ease-in; }
  90%  { transform: translateY(0); animation-timing-function: ease-out; }
  95%  { transform: translateY(-4%); animation-timing-function: ease-in; }
  100% { transform: translateY(0); }
}

  <script>
/* Sound effects synthesised with the Web Audio API (no audio files needed)
   and optional narration with the browser's Speech Synthesis API. */
(function () {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v === 'true'; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } }
  };

  let ctx = null;
  let master = null;
  let enabled = store.get('fm-sound', true);

  function ac() {
    if (!enabled) return null;
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
      master = ctx.createGain();
      master.gain.value = 0.8;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone({ f = 440, f2 = null, t = 0, d = 0.15, type = 'sine', g = 0.12, a = 0.008 }) {
    const c = ac(); if (!c) return;
    const now = c.currentTime + t;
    const o = c.createOscillator();
    const v = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, now);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + d);
    v.gain.setValueAtTime(0.0001, now);
    v.gain.exponentialRampToValueAtTime(g, now + a);
    v.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(v).connect(master);
    o.start(now);
    o.stop(now + d + 0.05);
  }

  function noise({ t = 0, d = 0.2, g = 0.1, type = 'bandpass', f = 800, f2 = null, q = 1 }) {
    const c = ac(); if (!c) return;
    const now = c.currentTime + t;
    const len = Math.max(1, Math.floor(c.sampleRate * d));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = type; filt.Q.value = q;
    filt.frequency.setValueAtTime(f, now);
    if (f2) filt.frequency.exponentialRampToValueAtTime(f2, now + d);
    const v = c.createGain();
    v.gain.setValueAtTime(0.0001, now);
    v.gain.exponentialRampToValueAtTime(g, now + d * 0.3);
    v.gain.exponentialRampToValueAtTime(0.0001, now + d);
    src.connect(filt).connect(v).connect(master);
    src.start(now);
    src.stop(now + d + 0.05);
  }

  const Sound = {
    get enabled() { return enabled; },
    setEnabled(v) { enabled = v; store.set('fm-sound', v); if (v) ac(); },
    unlock() { ac(); },

    /** UI click */
    click() { tone({ f: 880, d: 0.06, type: 'triangle', g: 0.07 }); },
    /** Dialogue line appears */
    pop() { tone({ f: 520, f2: 780, d: 0.09, g: 0.05 }); },
    /** Scene transition */
    whoosh() { noise({ d: 0.38, g: 0.07, f: 300, f2: 2400, q: 0.8 }); },
    /** Disc falls into the board, thuds and settles (synced to the CSS animation) */
    drop() {
      tone({ f: 1300, f2: 320, d: 0.48, g: 0.045 });
      tone({ f: 150, f2: 55, t: 0.5, d: 0.22, g: 0.32 });
      noise({ t: 0.5, d: 0.09, g: 0.18, type: 'lowpass', f: 700 });
      tone({ f: 130, f2: 70, t: 0.62, d: 0.1, g: 0.12 });
      tone({ f: 120, f2: 70, t: 0.7, d: 0.07, g: 0.06 });
    },
    /** Strong move */
    correct() {
      [523.25, 659.25, 783.99].forEach((f, i) => tone({ f, t: i * 0.09, d: 0.32, type: 'triangle', g: 0.11 }));
      tone({ f: 1046.5, t: 0.27, d: 0.55, g: 0.07 });
    },
    /** Less effective move / likely consequence */
    wrong() {
      tone({ f: 392, d: 0.18, type: 'triangle', g: 0.09 });
      tone({ f: 311.13, t: 0.16, d: 0.34, type: 'triangle', g: 0.09 });
    },
    /** Four in a row */
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone({ f, t: i * 0.1, d: 0.3, type: 'triangle', g: 0.1 }));
      [523.25, 659.25, 783.99, 1046.5].forEach(f => tone({ f, t: 0.48, d: 1.4, g: 0.05 }));
      noise({ t: 0.46, d: 0.9, g: 0.03, type: 'highpass', f: 5000 });
    }
  };

  /* ---------- Narration ---------- */
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  let narrate = store.get('fm-narration', false);
  const VOICE = {
    narrator: { pitch: 1.0, rate: 0.98 },
    jordan:   { pitch: 0.78, rate: 1.0 },
    maia:     { pitch: 1.18, rate: 0.98 },
    luis:     { pitch: 0.92, rate: 1.02 },
    feedback: { pitch: 1.05, rate: 0.98 }
  };

  const Narrator = {
    supported: !!synth,
    get enabled() { return narrate && !!synth; },
    setEnabled(v) { narrate = v; store.set('fm-narration', v); if (!v) this.stop(); },
    stop() { if (synth) synth.cancel(); },
    /** lines: [{speaker, text}] */
    speak(lines, { interrupt = true } = {}) {
      if (!this.enabled) return;
      if (interrupt) synth.cancel();
      lines.forEach(l => {
        const u = new SpeechSynthesisUtterance(l.text);
        const v = VOICE[l.speaker] || VOICE.narrator;
        u.pitch = v.pitch; u.rate = v.rate; u.lang = 'en-US';
        synth.speak(u);
      });
    }
  };

  window.Sound = Sound;
  window.Narrator = Narrator;
})();

</script>

        { speaker: 'narrator', text: 'The team found that the problem wasn’t simply a lack of training. Employees needed realistic practice, timely support, and leaders working toward the same outcome.' },
        { speaker: 'jordan', text: 'We started by disagreeing about another course. We ended with a solution built around the work and a way to see whether it helps.' },
        { speaker: 'maia', text: 'Now we can learn, adjust, and scale based on evidence.' }
      ],
      next: 'Review the four moves'
    }
  ],

  closing: {
    title: 'Four moves to leadership alignment',
    moves: [
      { icon: 'search', text: 'Diagnose the performance need.' },
      { icon: 'target', text: 'Align people around a shared outcome.' },
      { icon: 'layers', text: 'Design learning and support around the work.' },
      { icon: 'gauge', text: 'Pilot, measure, and improve.' }
    ],
    narration: 'When a workforce challenge calls for more than a course, The Space of Agnes Elisa can help connect learning strategy, capability assessment, learner-centered design, learning technology, and performance measurement.',
    cta: { text: 'Explore eLearning and workforce learning services', url: 'https://agneselisa.net', display: 'agneselisa.net' }
  }
};

</script>
  <script>
/* Four Moves to Alignment — app logic */
(function () {
  const C = window.COURSE;
  const COLS = 7, ROWS = 6, WIN_ROW = 5, WIN_COLS = [1, 2, 3, 4];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = (s, r = document) => r.querySelector(s);
  const story = $('#story');
  const discsLayer = $('#boardDiscs');
  const board = $('#board');

  // step 0 = title, 1..6 = scenes, 7 = closing
  const state = { step: 0, discs: 0, firstTry: 0, attempts: {}, timers: [] };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const later = (fn, ms) => { const t = setTimeout(fn, ms); state.timers.push(t); return t; };
  const clearTimers = () => { state.timers.forEach(clearTimeout); state.timers = []; };

  /* ---------------- Board ---------------- */
  function buildBoard() {
    const holes = $('#holeCircles'), rings = $('#holeRings');
    let h = '', r = '';
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const cx = 50 + col * 100, cy = 50 + row * 100;
        h += `<circle cx="${cx}" cy="${cy}" r="38"/>`;
        r += `<circle cx="${cx}" cy="${cy}" r="38"/>`;
      }
    }
    holes.innerHTML = h; rings.innerHTML = r;

    const legend = $('#boardLegend');
    legend.innerHTML = Array.from({ length: COLS }, (_, col) => {
      const i = WIN_COLS.indexOf(col);
      if (i < 0) return '<li class="legend-slot" aria-hidden="true"></li>';
      const m = C.moves[i];
      return `<li class="legend-slot legend-slot--move" data-move="${i}">${icon(m.icon)}<span>${m.label}</span></li>`;
    }).join('');
  }

  function dropDisc(moveIndex) {
    const col = WIN_COLS[moveIndex];
    const disc = document.createElement('div');
    disc.className = 'disc';
    disc.style.left = (col * 100 / COLS) + '%';
    disc.style.top = (WIN_ROW * 100 / ROWS) + '%';
    disc.style.setProperty('--fall', `-${(WIN_ROW + 1.4) * 100}%`);
    disc.innerHTML = `<span class="disc__face">${icon(C.moves[moveIndex].icon)}</span>`;
    disc.setAttribute('aria-hidden', 'true');
    discsLayer.appendChild(disc);
    if (!reduceMotion) { disc.classList.add('is-dropping'); Sound.drop(); }
    else Sound.correct();
    state.discs = Math.max(state.discs, moveIndex + 1);
    updateCount();
    $(`.legend-slot--move[data-move="${moveIndex}"]`).classList.add('is-on');
  }

  function celebrateBoard() {
    board.classList.add('is-win');
    Sound.win();
  }

  function resetBoard() {
    discsLayer.innerHTML = '';
    board.classList.remove('is-win');
    document.querySelectorAll('.legend-slot--move').forEach(el => el.classList.remove('is-on'));
    state.discs = 0;
    updateCount();
  }

  function updateCount() {
    $('#discCount').textContent = state.discs === 4 ? 'Four in a row!' : `${state.discs} of 4 connections`;
  }

  /* ---------------- Progress ---------------- */
  function renderProgress() {
    const labels = ['Start', ...C.scenes.map(s => s.title), 'Takeaways'];
    $('#progress').innerHTML = labels.map((l, i) => {
      const cls = i < state.step ? 'is-done' : i === state.step ? 'is-current' : '';
      return `<li class="${cls}" title="${esc(l)}"><span class="sr-only">${esc(l)}${i === state.step ? ' (current)' : i < state.step ? ' (complete)' : ''}</span></li>`;
    }).join('');
  }

  /* ---------------- Visuals ---------------- */
  function visual(v) {
    switch (v.type) {
      case 'dashboard':
        return `<figure class="visual visual--dashboard">
          <div class="dash">
            <div class="dash__head">${icon('bot')}<span>Northstar Services · AI support platform</span><span class="dash__tag">Week 3</span></div>
            <div class="dash__kpis">
              <div class="kpi kpi--good">${icon('cap')}<div><strong>100%</strong><span>Training completed</span></div></div>
              <div class="kpi kpi--bad">${icon('clock')}<div><strong>+38%</strong><span>Time to resolve issues</span></div></div>
            </div>
            <div class="dash__chart" aria-hidden="true">
              ${[34, 40, 46, 55, 63, 72, 80].map((h, i) => `<span style="--h:${h}%;--i:${i}"></span>`).join('')}
            </div>
            <p class="dash__axis"><span>Launch</span><span>Average resolution time</span><span>Today</span></p>
          </div>
          <figcaption>A company team reviews the dashboard. The board is empty.</figcaption>
        </figure>`;
      case 'tiles':
        return `<figure class="visual">
          <div class="tiles">${v.tiles.map((t, i) => `<div class="tile ${t.tone === 'muted' ? 'tile--muted' : ''}" style="--i:${i}">${icon(t.icon)}<span class="tile__label">${esc(t.label)}</span><span class="tile__value">${esc(t.value)}</span></div>`).join('')}</div>
          <figcaption>${esc(v.caption)}</figcaption>
        </figure>`;
      case 'people':
        return `<figure class="visual">
          <div class="huddle">
            ${v.groups.map((g, i) => `<div class="huddle__group" style="--i:${i}">${icon(g.icon)}<span>${esc(g.label)}</span></div>`).join('<span class="huddle__link">' + icon('link') + '</span>')}
          </div>
          <ul class="insights">${v.insights.map(n => `<li>${icon(n.icon)}<span>${esc(n.text)}</span></li>`).join('')}</ul>
          <figcaption>${esc(v.caption)}</figcaption>
        </figure>`;
      case 'prototype':
        return `<figure class="visual">
          <div class="proto">
            <div class="proto__laptop">
              <div class="proto__screen">
                <p class="proto__title">${icon('play')} Practice case 3 of 5</p>
                <p class="proto__msg">${icon('bot')} AI suggestion: <em>“Reset the customer’s account…”</em></p>
                <p class="proto__warn">${icon('alert')} Suggestion incomplete. What do you do next?</p>
              </div>
              <div class="proto__base"></div>
            </div>
            <div class="proto__aid">
              <p class="proto__aid-title">${icon('clipboard')} Job aid</p>
              <ol><li>Verify identity</li><li>Check AI suggestion</li><li>Fill the gap</li><li>Confirm resolution</li></ol>
            </div>
          </div>
          <figcaption>${esc(v.caption)}</figcaption>
        </figure>`;
      case 'pilot':
        return `<figure class="visual">
          <div class="pilot">
            <div class="pilot__step">${icon('flag')}<strong>Pilot team</strong><span>Updated practice + job aids</span></div>
            <span class="pilot__arrow">${icon('arrowRight')}</span>
            <div class="pilot__step">${icon('eye')}<strong>Managers</strong><span>Observe and coach</span></div>
            <span class="pilot__arrow">${icon('arrowRight')}</span>
            <div class="pilot__step">${icon('calendar')}<strong>One week later</strong><span>Review the results</span></div>
          </div>
          <figcaption>${esc(v.caption)}</figcaption>
        </figure>`;
      case 'plan':
        return `<figure class="visual">
          <ol class="plan">${v.steps.map((s, i) => `<li style="--i:${i}"><span class="plan__num">${i + 1}</span>${icon(s.icon)}<span>${esc(s.label)}</span></li>`).join('')}</ol>
          <figcaption>${esc(v.caption)}</figcaption>
        </figure>`;
      default: return '';
    }
  }

  function line(l, i) {
    const sp = C.speakers[l.speaker];
    const avatar = sp.icon ? icon(sp.icon) : `<span>${sp.initials}</span>`;
    return `<div class="line line--${l.speaker}" style="--i:${i}">
      <div class="avatar avatar--${l.speaker}" aria-hidden="true">${avatar}</div>
      <div class="bubble">
        <p class="bubble__who">${esc(sp.name)}${sp.role ? `<span>, ${esc(sp.role)}</span>` : ''}</p>
        <p class="bubble__text">“${esc(l.text)}”</p>
      </div>
    </div>`;
  }

  /* ---------------- Screens ---------------- */
  function renderTitle() {
    story.innerHTML = `
      <div class="screen screen--title">
        <p class="eyebrow">${icon('users')} ${esc(C.format)} · ${esc(C.length)}</p>
        <h1 tabindex="-1">${esc(C.title)}</h1>
        <p class="lead">${esc(C.goal)}</p>
        <ul class="chips" aria-label="Audience">${C.audience.map(a => `<li>${esc(a)}</li>`).join('')}</ul>
        <div class="how">
          <h2>How it works</h2>
          <ul>
            <li>${icon('message')}<span>Follow the Northstar Services team as a new platform launch slips.</span></li>
            <li>${icon('target')}<span>At each decision point, choose the leadership action you would take.</span></li>
            <li>${icon('check')}<span>A strong choice drops a connection disc. A weaker choice shows its likely consequence so you can reconsider.</span></li>
            <li>${icon('trophy')}<span>Connect four discs to reveal the team’s solution.</span></li>
          </ul>
        </div>
        <div class="actions">
          <button class="btn btn--primary" id="startBtn" type="button">${icon('play')} Start the scenario</button>
        </div>
        <p class="tip">${icon('volume')} This scenario includes sound effects. Turn on <strong>Narration</strong> above to hear the script read aloud.</p>
      </div>`;
    $('#startBtn').addEventListener('click', () => { Sound.unlock(); Sound.click(); go(1); });
  }

  function renderScene(scene) {
    const hasQ = !!scene.question;
    story.innerHTML = `
      <article class="screen screen--scene">
        <p class="eyebrow">${icon(scene.icon)} ${esc(scene.eyebrow)}</p>
        <h1 tabindex="-1">${esc(scene.title)}</h1>
        ${visual(scene.visual)}
        <div class="dialogue">${scene.lines.map(line).join('')}</div>
        ${hasQ ? `
        <section class="decision" id="decision" hidden aria-labelledby="qText">
          <p class="decision__tag">${icon('target')} Your decision</p>
          <h2 class="decision__q" id="qText">${esc(scene.question)}</h2>
          <div class="options" role="group" aria-labelledby="qText">
            ${scene.options.map(o => `<button class="option" type="button" data-key="${o.key}">
              <span class="option__key">${o.key}</span><span class="option__text">${esc(o.text)}</span><span class="option__state" aria-hidden="true"></span>
            </button>`).join('')}
          </div>
          <div class="feedback" id="feedback" role="status" hidden></div>
        </section>` : ''}
        <div class="actions" id="sceneActions" hidden>
          <button class="btn btn--primary" id="nextBtn" type="button">${esc(scene.next)} ${icon('arrowRight')}</button>
        </div>
      </article>`;

    // Staggered reveal of dialogue with a soft "pop"
    const step = reduceMotion ? 0 : 900;
    scene.lines.forEach((_, i) => later(() => Sound.pop(), 350 + i * step));
    Narrator.speak(scene.lines);
    const afterLines = 350 + scene.lines.length * step;

    if (hasQ) {
      later(() => { const d = $('#decision'); d.hidden = false; d.classList.add('reveal'); }, afterLines);
      story.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => choose(scene, btn)));
    } else {
      later(() => { $('#sceneActions').hidden = false; }, afterLines);
      if (scene.win) later(celebrateBoard, 500);
    }
    $('#nextBtn').addEventListener('click', () => { Sound.click(); go(state.step + 1); });
  }

  function choose(scene, btn) {
    const opt = scene.options.find(o => o.key === btn.dataset.key);
    const fb = $('#feedback');
    state.attempts[scene.id] = (state.attempts[scene.id] || 0) + 1;

    if (opt.correct) {
      if (state.attempts[scene.id] === 1) state.firstTry++;
      story.querySelectorAll('.option').forEach(b => { b.disabled = true; });
      btn.classList.add('is-correct');
      btn.querySelector('.option__state').innerHTML = icon('check');
      fb.className = 'feedback feedback--good';
      fb.innerHTML = `<div class="feedback__icon">${icon('check')}</div>
        <div><p class="feedback__title">Strong move: a connection disc drops into the board.</p><p>${esc(scene.feedback)}</p></div>`;
      fb.hidden = false;
      Sound.correct();
      Narrator.speak([{ speaker: 'feedback', text: scene.feedback }]);

      const narrow = window.matchMedia('(max-width: 900px)').matches;
      if (narrow) $('#boardPanel').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
      later(() => dropDisc(scene.move), narrow ? 600 : 350);
      later(() => {
        $('#sceneActions').hidden = false;
        if (narrow) fb.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
        $('#nextBtn').focus({ preventScroll: true });
      }, narrow ? 1900 : 1200);
    } else {
      btn.classList.add('is-tried');
      btn.disabled = true;
      btn.querySelector('.option__state').innerHTML = icon('alert');
      fb.className = 'feedback feedback--warn';
      fb.innerHTML = `<div class="feedback__icon">${icon('alert')}</div>
        <div><p class="feedback__title">Likely consequence</p><p>${esc(opt.consequence)}</p>
        <p class="feedback__retry">${icon('refresh')} Reconsider: choose another action.</p></div>`;
      fb.hidden = false;
      fb.classList.remove('shake'); void fb.offsetWidth; fb.classList.add('shake');
      Sound.wrong();
      Narrator.speak([{ speaker: 'feedback', text: 'Likely consequence. ' + opt.consequence + ' Reconsider your choice.' }]);
    }
  }

  function renderClosing() {
    const c = C.closing;
    const perfect = state.firstTry === 4;
    story.innerHTML = `
      <div class="screen screen--closing">
        <p class="eyebrow">${icon('trophy')} Four in a row</p>
        <h1 tabindex="-1">${esc(c.title)}</h1>
        <ol class="takeaways">${c.moves.map((m, i) => `<li style="--i:${i}"><span class="takeaways__disc">${icon(m.icon)}</span><span class="takeaways__num">${i + 1}.</span><span>${esc(m.text)}</span></li>`).join('')}</ol>
        <p class="score">${icon('star')}<span>You made <strong>${state.firstTry} of 4</strong> moves on your first try. ${perfect ? 'Excellent leadership instincts.' : 'Each reconsidered choice is practice for the real conversation.'}</span></p>
        <div class="dialogue">${line({ speaker: 'narrator', text: c.narration }, 0)}</div>
        <div class="cta">
          <p class="cta__text">${esc(c.cta.text)} at <strong>${esc(c.cta.display)}</strong>.</p>
          <div class="actions">
            <a class="btn btn--primary" href="${c.cta.url}" target="_blank" rel="noopener">${icon('globe')} Visit ${esc(c.cta.display)}</a>
            <button class="btn btn--ghost" id="replayBtn" type="button">${icon('refresh')} Replay the scenario</button>
          </div>
        </div>
      </div>`;
    later(() => Sound.pop(), 400);
    Narrator.speak([
      { speaker: 'narrator', text: c.title + '. ' + c.moves.map((m, i) => `${i + 1}. ${m.text}`).join(' ') },
      { speaker: 'narrator', text: c.narration }
    ]);
    $('#replayBtn').addEventListener('click', () => {
      Sound.click();
      resetBoard();
      state.firstTry = 0; state.attempts = {};
      go(0);
    });
  }

  /* ---------------- Navigation ---------------- */
  function go(step) {
    clearTimers();
    Narrator.stop();
    state.step = step;
    if (step > 0) Sound.whoosh();
    story.classList.remove('enter'); void story.offsetWidth; story.classList.add('enter');

    if (step === 0) renderTitle();
    else if (step <= C.scenes.length) renderScene(C.scenes[step - 1]);
    else renderClosing();

    renderProgress();
    const h = story.querySelector('h1');
    if (h) h.focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  /* ---------------- Toggles ---------------- */
  function initToggles() {
    const sBtn = $('#soundToggle'), nBtn = $('#narrationToggle');
    const paint = () => {
      sBtn.setAttribute('aria-pressed', String(Sound.enabled));
      sBtn.querySelector('.icon-btn__icon').innerHTML = icon(Sound.enabled ? 'volume' : 'mute');
      nBtn.setAttribute('aria-pressed', String(Narrator.enabled));
      nBtn.querySelector('.icon-btn__icon').innerHTML = icon('headphones');
    };
    sBtn.addEventListener('click', () => { Sound.setEnabled(!Sound.enabled); Sound.click(); paint(); });
    if (!Narrator.supported) { nBtn.hidden = true; }
    nBtn.addEventListener('click', () => { Narrator.setEnabled(!Narrator.enabled); Sound.click(); paint(); });
    paint();
  }

  /* ---------------- Boot ---------------- */
  $('#year').textContent = new Date().getFullYear();
  buildBoard();
  initToggles();
  updateCount();
  go(0);
})();

</script>
</body>
